name: Phase 3 worker tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-acceptance:
    name: PostgreSQL worker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: factcheck_test
          POSTGRES_USER: factcheck
          POSTGRES_PASSWORD: phase3_test_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U factcheck -d factcheck_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out the project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run worker acceptance tests
        env:
          TEST_DATABASE_URL: postgresql://factcheck:phase3_test_password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/factcheck_test
        run: python -m unittest backend.tests.test_worker -v
