name: fact-check-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: factcheck
      POSTGRES_USER: factcheck
      POSTGRES_PASSWORD: factcheck_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "factcheck", "-d", "factcheck"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
